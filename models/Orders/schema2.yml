version: 2
sources:
  - name: bigquery_source
    schema: staging
    tables:
      - name: retail_sales
models:
  - name: transformed_sales
    description: "Transformed sales table"
    config:
      materialized: table
      alias: sales_rpt
    columns:
      - name: sales_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null